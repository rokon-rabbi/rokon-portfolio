allowBuilds:
  esbuild: true
  sharp: true

peerDependencyRules:
  allowedVersions:
    "tsconfck>typescript": "6"

# Minimal transitive security patches; validated by build and regression checks.
overrides:
  yaml: ">=2.8.3 <3"
  esbuild: ">=0.28.1 <0.29"
  fast-uri: ">=3.1.8 <4"
  http-cache-semantics: ">=4.3.0 <5"
  source-map-js: ">=1.2.2 <2"
  postcss-selector-parser: ">=7.1.6 <8"
